<!DOCTYPE html>
<html>
<head>
  <title>Booking Confirmed - StayFinder</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<nav class="navbar">
  <div class="nav-container">
    <a href="/index.html" class="logo">StayFinder</a>
    <div class="nav-buttons">
      <a href="/login.html" class="btn-outline">Login</a>
      <a href="/register.html" class="btn-outline">Sign up</a>
    </div>
  </div>
</nav>

<div style="max-width:600px;margin:80px auto;padding:0 40px;text-align:center;">
  <div style="font-size:60px;margin-bottom:20px;">🎉</div>
  <h1 style="font-size:28px;margin-bottom:12px;">Reservation confirmed!</h1>
  <p style="color:#666;margin-bottom:30px;">Your stay has been booked successfully.</p>

  <div id="bookingDetails" style="
    background:white;
    border-radius:20px;
    padding:24px;
    box-shadow:0 4px 20px rgba(0,0,0,0.08);
    margin-bottom:30px;
    text-align:left;
  "></div>

  <div style="display:flex;gap:16px;justify-content:center;">
    <a href="/index.html" style="
      padding:14px 28px;
      background:var(--primary);
      color:white;
      border-radius:30px;
      text-decoration:none;
      font-weight:600;
    ">Back to Home</a>
    <a href="/profile.html" style="
      padding:14px 28px;
      border:2px solid var(--primary);
      color:var(--primary);
      border-radius:30px;
      text-decoration:none;
      font-weight:600;
    ">My Trips</a>
  </div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const total = params.get("total");
  const checkin = params.get("checkin");
  const checkout = params.get("checkout");

  const details = document.getElementById("bookingDetails");
  if (details) {
    const checkinDate = new Date(checkin + "T00:00:00");
    const checkoutDate = new Date(checkout + "T00:00:00");
    const nights = Math.round((checkoutDate - checkinDate) / (1000 * 60 * 60 * 24));

    details.innerHTML = `
      <div style="display:flex;justify-content:space-between;margin-bottom:12px;">
        <span style="color:#666;">Check-in</span>
        <strong>${checkinDate.toLocaleDateString("en-GB", {day:"numeric",month:"short",year:"numeric"})}</strong>
      </div>
      <div style="display:flex;justify-content:space-between;margin-bottom:12px;">
        <span style="color:#666;">Check-out</span>
        <strong>${checkoutDate.toLocaleDateString("en-GB", {day:"numeric",month:"short",year:"numeric"})}</strong>
      </div>
      <div style="display:flex;justify-content:space-between;margin-bottom:12px;">
        <span style="color:#666;">Nights</span>
        <strong>${nights}</strong>
      </div>
      <div style="display:flex;justify-content:space-between;padding-top:12px;border-top:1px solid #eee;">
        <span style="font-weight:700;">Total</span>
        <strong style="color:var(--primary);font-size:18px;">${total ? "$" + total : "N/A"}</strong>
      </div>
    `;
  }
</script>

<script src="/scripts/navbar-auth.js"></script>
<script src="/scripts/support.js"></script>
</body>
</html>
