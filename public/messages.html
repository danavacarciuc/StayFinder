<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Messages - StayFinder</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background: #f7f7f7; }

    .messages-layout {
      max-width: 1100px;
      margin: 90px auto 40px;
      padding: 0 24px;
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 0;
      height: calc(100vh - 130px);
      background: white;
      border-radius: 20px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      overflow: hidden;
    }

    /* Conversations list */
    .conversations-panel {
      border-right: 1px solid #f0f0f0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .conversations-header {
      padding: 24px 20px 16px;
      border-bottom: 1px solid #f0f0f0;
    }

    .conversations-header h2 {
      font-size: 20px;
      font-weight: 700;
      margin: 0;
    }

    .conversations-list {
      overflow-y: auto;
      flex: 1;
    }

    .conversation-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      cursor: pointer;
      transition: background 0.15s;
      border-bottom: 1px solid #fafafa;
      position: relative;
    }

    .conversation-item:hover { background: #f9f9f9; }
    .conversation-item.active { background: #f0f7ff; }

    .conversation-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }

    .conversation-info { flex: 1; min-width: 0; }

    .conversation-name {
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .conversation-property {
      font-size: 12px;
      color: #888;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }

    .conversation-last {
      font-size: 12px;
      color: #aaa;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .conversation-last.unread { color: #222; font-weight: 600; }

    .unread-badge {
      background: #e31c5f;
      color: white;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .empty-conversations {
      text-align: center;
      padding: 60px 20px;
      color: #aaa;
    }

    .empty-conversations i {
      font-size: 2.5rem;
      display: block;
      margin-bottom: 12px;
      color: #ddd;
    }

    /* Chat panel */
    .chat-panel {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      padding: 18px 24px;
      border-bottom: 1px solid #f0f0f0;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .chat-header img {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
    }

    .chat-header-info h3 {
      font-size: 16px;
      font-weight: 700;
      margin: 0 0 2px 0;
    }

    .chat-header-info p {
      font-size: 13px;
      color: #888;
      margin: 0;
    }

    .chat-property-banner {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 24px;
      background: #f9f9f9;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
      transition: background 0.15s;
    }

    .chat-property-banner:hover { background: #f0f0f0; }

    .chat-property-banner img {
      width: 52px;
      height: 40px;
      border-radius: 8px;
      object-fit: cover;
    }

    .chat-property-banner-info {
      flex: 1;
    }

    .chat-property-banner-info .prop-title {
      font-weight: 600;
      font-size: 13px;
      color: #222;
    }

    .chat-property-banner-info .prop-city {
      font-size: 12px;
      color: #888;
    }

    .chat-property-banner .view-btn {
      font-size: 12px;
      color: #e31c5f;
      font-weight: 600;
      white-space: nowrap;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .message-bubble {
      max-width: 65%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
    }

    .message-bubble.sent {
      background: #222;
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .message-bubble.received {
      background: #f0f0f0;
      color: #222;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .message-time {
      font-size: 11px;
      color: #aaa;
      margin-top: 2px;
    }

    .message-time.sent { text-align: right; align-self: flex-end; }
    .message-time.received { text-align: left; align-self: flex-start; }

    .chat-input-area {
      padding: 16px 24px;
      border-top: 1px solid #f0f0f0;
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }

    .chat-input-area textarea {
      flex: 1;
      border: 1.5px solid #e0e0e0;
      border-radius: 24px;
      padding: 10px 16px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      resize: none;
      max-height: 120px;
      transition: border-color 0.2s;
      line-height: 1.5;
    }

    .chat-input-area textarea:focus { border-color: #222; }

    .send-btn {
      width: 44px;
      height: 44px;
      background: #222;
      color: white;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s;
    }

    .send-btn:hover { background: #444; }

    .no-conversation-selected {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #aaa;
      gap: 12px;
    }

    .no-conversation-selected i {
      font-size: 3rem;
      color: #ddd;
    }

    .no-conversation-selected p {
      font-size: 15px;
    }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="nav-container">
    <a href="/index.html" class="logo">StayFinder</a>
    <div class="nav-buttons">
      <div id="navModeContainer"></div>
      <a href="login.html" class="btn-outline">Login</a>
      <a href="/register.html" class="btn-outline">Sign up</a>
    </div>
  </div>
</nav>

<div class="messages-layout">

  <!-- Conversations List -->
  <div class="conversations-panel">
    <div class="conversations-header">
      <h2>Messages</h2>
    </div>
    <div class="conversations-list" id="conversationsList">
      <div class="empty-conversations">
        <i class="fa-regular fa-comment-dots"></i>
        <p>No conversations yet</p>
      </div>
    </div>
  </div>

  <!-- Chat Panel -->
  <div class="chat-panel" id="chatPanel">
    <div class="no-conversation-selected" id="noConversationSelected">
      <i class="fa-regular fa-comment-dots"></i>
      <p>Select a conversation to start chatting</p>
    </div>
  </div>

</div>

<script src="/scripts/navbar-auth.js"></script>
<script src="/scripts/messages.js"></script>
<script src="/scripts/support.js"></script>
</body>
</html>
