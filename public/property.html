<!DOCTYPE html>
<html>
<head>
  <title>Property - StayFinder</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<nav class="navbar">
  <div class="nav-container">
    <a href="/index.html" class="logo">StayFinder</a>
    <div class="nav-buttons">
      <div id="navModeContainer"></div>
      <a href="login.html" class="btn-outline">Login</a>
      <a href="/register.html" class="btn-outline">Sign up</a>
    </div>
  </div>
</nav>

<!-- STICKY NAV -->
<div id="stickyBar" style="display:none;position:fixed;top:0;left:0;right:0;background:white;border-bottom:1px solid #eee;padding:14px 80px;z-index:1000;justify-content:space-between;align-items:center;">
  <div style="display:flex;gap:30px;">
    <a href="#photos" style="text-decoration:none;color:#222;font-weight:500;">Photos</a>
    <a href="#facilities" style="text-decoration:none;color:#222;font-weight:500;">Facilities</a>
    <a href="#reviews" style="text-decoration:none;color:#222;font-weight:500;">Reviews</a>
    <a href="#location" style="text-decoration:none;color:#222;font-weight:500;">Location</a>
  </div>
  <div style="display:flex;align-items:center;gap:16px;">
    <span id="stickyPrice" style="font-weight:600;"></span>
    <button onclick="document.getElementById('bookBtn').scrollIntoView({behavior:'smooth'})" style="padding:10px 20px;background:var(--primary);color:white;border:none;border-radius:30px;font-weight:600;cursor:pointer;">Reserve</button>
  </div>
</div>

<div class="property-page" style="max-width:1200px;margin:40px auto;padding:0 40px;">

  <h1 id="propertyTitle" style="font-size:26px;margin-bottom:8px;"></h1>
  <p id="propertyLocation" style="color:#666;margin-bottom:20px;"></p>

  <div id="photos" style="display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:1fr 1fr;gap:8px;height:400px;border-radius:16px;overflow:hidden;margin-bottom:40px;">
    <div id="mainImage" style="grid-row:span 2;background:#ddd;"></div>
    <div id="img2" style="background:#ddd;"></div>
    <div id="img3" style="background:#ddd;"></div>
    <div id="img4" style="background:#ddd;"></div>
    <div id="img5" style="background:#ddd;"></div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 380px;gap:60px;align-items:flex-start;">

    <!-- LEFT -->
    <div>
      <div style="display:flex;justify-content:space-between;align-items:center;padding-bottom:24px;border-bottom:1px solid #eee;margin-bottom:24px;">
        <div>
          <h2 id="propertySubtitle" style="font-size:20px;margin:0 0 4px 0;"></h2>
          <p id="propertySpecs" style="color:#666;margin:0;"></p>
        </div>
      </div>

      <p id="propertyDescription" style="line-height:1.7;color:#444;padding-bottom:24px;border-bottom:1px solid #eee;margin-bottom:24px;"></p>

      <!-- FACILITIES -->
      <div id="facilities" style="padding-bottom:24px;border-bottom:1px solid #eee;margin-bottom:24px;">
        <h3 style="margin-bottom:16px;">What this place offers</h3>
        <div id="facilitiesList" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;"></div>
      </div>

      <!-- REVIEWS -->
      <div id="reviews" style="padding-bottom:24px;border-bottom:1px solid #eee;margin-bottom:24px;">
        <h3 style="margin-bottom:4px;">Reviews</h3>
        <div id="reviewsAverage" style="color:#666;font-size:14px;margin-bottom:20px;"></div>
        <div id="reviewsList" style="margin-bottom:32px;"></div>
        <div id="reviewFormWrapper" style="display:none;background:#f9f9f9;border-radius:16px;padding:24px;">
          <h4 style="margin:0 0 16px 0;font-size:16px;">Leave a review</h4>
          <div style="margin-bottom:16px;">
            <div style="font-size:13px;font-weight:600;margin-bottom:8px;text-transform:uppercase;color:#444;">Rating</div>
            <div id="starRating" style="display:flex;gap:8px;font-size:28px;cursor:pointer;">
              <span data-value="1" style="color:#ddd;">★</span>
              <span data-value="2" style="color:#ddd;">★</span>
              <span data-value="3" style="color:#ddd;">★</span>
              <span data-value="4" style="color:#ddd;">★</span>
              <span data-value="5" style="color:#ddd;">★</span>
            </div>
            <input type="hidden" id="reviewRating" value="0">
          </div>
          <div style="margin-bottom:16px;">
            <div style="font-size:13px;font-weight:600;margin-bottom:8px;text-transform:uppercase;color:#444;">Comment</div>
            <textarea id="reviewComment" rows="4" placeholder="Share your experience..." style="width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:14px;resize:vertical;box-sizing:border-box;font-family:inherit;"></textarea>
          </div>
          <button id="submitReviewBtn" style="padding:12px 28px;background:var(--primary);color:white;border:none;border-radius:30px;font-weight:600;cursor:pointer;font-size:14px;">Submit Review</button>
          <div id="reviewMsg" style="margin-top:12px;font-size:14px;"></div>
        </div>
        <div id="reviewNotEligible" style="display:none;color:#888;font-size:14px;"></div>
      </div>

      <!-- LOCATION -->
      <div id="location" style="padding-bottom:24px;border-bottom:1px solid #eee;margin-bottom:24px;">
        <h3 style="margin-bottom:16px;">Location</h3>
        <div id="propertyMap" style="height:300px;border-radius:16px;overflow:hidden;"></div>
      </div>

      <!-- SIMILAR PROPERTIES -->
      <div id="similarSection" style="display:none;">
        <h3 style="margin-bottom:4px;">Similar properties</h3>
        <p id="similarSubtitle" style="color:#888;font-size:14px;margin-bottom:20px;"></p>
        <div id="similarContainer" style="display:grid;grid-template-columns:repeat(2,1fr);gap:16px;"></div>
      </div>
    </div>

    <!-- RIGHT - BOOKING CARD -->
    <div id="bookingCard" style="position:sticky;top:100px;background:white;border-radius:20px;padding:28px;box-shadow:0 4px 30px rgba(0,0,0,0.12);">
      <div style="display:flex;align-items:baseline;gap:6px;margin-bottom:20px;">
        <span id="bookingPrice" style="font-size:22px;font-weight:700;"></span>
        <span style="color:#666;">/ night</span>
      </div>
      <div style="border:1px solid #ddd;border-radius:12px;overflow:hidden;margin-bottom:12px;">
        <div style="display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid #ddd;">
          <div style="padding:12px;border-right:1px solid #ddd;">
            <div style="font-size:11px;font-weight:700;text-transform:uppercase;">Check in</div>
            <input type="date" id="checkin" style="border:none;outline:none;font-size:14px;width:100%;cursor:pointer;">
          </div>
          <div style="padding:12px;">
            <div style="font-size:11px;font-weight:700;text-transform:uppercase;">Check out</div>
            <input type="date" id="checkout" style="border:none;outline:none;font-size:14px;width:100%;cursor:pointer;">
          </div>
        </div>
        <div style="padding:12px;">
          <div style="font-size:11px;font-weight:700;text-transform:uppercase;">Guests</div>
          <input type="number" id="guests" min="1" value="1" style="border:none;outline:none;font-size:14px;width:100%;">
        </div>
      </div>
      <button id="bookBtn" style="width:100%;padding:16px;background:var(--primary);color:white;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;margin-bottom:16px;">Reserve</button>
      <div id="priceBreakdown" style="color:#444;font-size:14px;"></div>
    </div>

  </div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="scripts/property.js"></script>
<script src="/scripts/navbar-auth.js"></script>
<script src="/scripts/favorites.js"></script>
<script src="/scripts/support.js"></script>


</body>
</html>
