<!DOCTYPE html>
<html>
<head>
  <title>Register - StayFinder</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body class="auth-page">

<div class="auth-wrapper">

  <div class="auth-card">

    <div class="auth-header">
      Login or Sign up
    </div>

    <div class="auth-body">

      <h2>Create your StayFinder account</h2>

      <form id="registerForm">
        <input type="text" id="name" placeholder="Full Name" required class="auth-input" />
        <input type="email" id="email" placeholder="Email" required class="auth-input" />
        <input type="password" id="password" placeholder="Password" required class="auth-input" />
        <button type="submit" class="auth-btn">CONTINUE</button>
      </form>

      <div class="auth-divider">or</div>
      <div class="auth-footer">
        Already have an account? <a href="login.html">Login</a>
      </div>

    </div>

  </div>

</div>

<script src="/scripts/register.js"></script>
<script src="/scripts/support.js"></script>
</body>
</html>
