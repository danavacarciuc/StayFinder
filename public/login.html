<!DOCTYPE html>
<html>
<head>
  <title>Login - StayFinder</title>
  <link rel="stylesheet" href="/style.css">
  
  
</head>

<body class = "auth-page">
<div class="auth-wrapper">

  <div class="auth-card">
    
    <div class="auth-header">
      Login or Sign up
    </div>

    <div class="auth-body">

      <h2>Welcome to StayFinder!</h2>

      <form id="loginForm">
        <input type="email" id="email" placeholder="Email" required class="auth-input" />
        <input type="password" id="password" placeholder="Password" required class="auth-input" />
        <button type="submit" class="auth-btn">CONTINUE</button>
      </form>

      <div class="auth-divider">or</div>

      <div class="auth-footer">
        Don't have an account? <a href="register.html">Register</a>
      </div>

    </div>

  </div>

</div>

<script src="/scripts/login.js"></script>
<script src="/scripts/support.js"></script>

</body>
</html>
